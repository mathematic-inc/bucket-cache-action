name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Check and generate ToolConfig files
        uses: mathematic-inc/toolconfig-action@1baf7b021e8bf6f0e20737753c13af0fc93c8570 # v2026.11.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run checks
        run: hk check --all --slow --skip-step toolconfig
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: node
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Build action
        run: npm run build
      - name: Check that dist is current
        run: git diff --exit-code -- dist
      - name: Run integration tests
        if: runner.os == 'Linux'
        run: npm run test:integration
  check-post-job-policy:
    name: Check post-job policy (${{ matrix.policy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        policy: [default, late-outcome, never]
    env:
      AWS_ACCESS_KEY_ID: cache-test
      AWS_SECRET_ACCESS_KEY: cache-test-password
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start disposable S3
        run: |
          docker run --detach --rm --name cache-post-test --publish 127.0.0.1:9000:9000 --tmpfs /data:rw,size=64m --env MINIO_ROOT_USER=cache-test --env MINIO_ROOT_PASSWORD=cache-test-password quay.io/thanos/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then break; fi
            sleep 1
          done
          aws --endpoint-url http://127.0.0.1:9000 s3api create-bucket --bucket test-cache-bucket
      # Registered first so this assertion runs after the cache's post step.
      - name: Register post-job cache check
        uses: $/.github/actions/verify-post
        with:
          bucket: test-cache-bucket
          endpoint: http://127.0.0.1:9000
          path: .post-cache
          key: post-job-test
          expected: ${{ matrix.policy != 'never' }}
      - name: Restore cache with default save policy
        if: matrix.policy == 'default'
        uses: $/
        with:
          bucket: test-cache-bucket
          region: us-east-1
          endpoint: http://127.0.0.1:9000
          force-path-style: "true"
          path: .post-cache
          key: post-job-test
          fail-on-error: "true"
      - name: Restore cache with save condition
        if: matrix.policy != 'default'
        uses: $/
        with:
          bucket: test-cache-bucket
          region: us-east-1
          endpoint: http://127.0.0.1:9000
          force-path-style: "true"
          path: .post-cache
          key: post-job-test
          fail-on-error: "true"
          save-if: ${{ matrix.policy == 'late-outcome' && steps.later.outcome == 'failure' && steps.install.outcome == 'success' }}
      - name: Populate cache after restore
        id: install
        run: |
          mkdir -p .post-cache
          echo 'installed dependency' > .post-cache/tool
      - name: Set failed outcome for save condition
        id: later
        if: matrix.policy == 'late-outcome'
        continue-on-error: true
        run: exit 1
  required:
    name: required
    if: always()
    needs: [check, verify, check-post-job-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null; then
            echo "::error::A job failed or was cancelled."
            exit 1
          fi
